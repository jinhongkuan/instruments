services:
  postgres:
    image: postgres:17-alpine
    container_name: instruments-postgres
    environment:
      POSTGRES_USER: instruments
      POSTGRES_PASSWORD: instruments
      POSTGRES_DB: instruments
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instruments"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
